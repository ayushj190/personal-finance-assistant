<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Cash Flow Sankey</title>
  <script src="./plotly.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    #wrapper {
      width: 100%;
      height: 460px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    #banner-bar {
      position: absolute;
      top: 6px;
      right: 14px;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      padding: 3px 10px 3px 12px;
      font-size: 11px;
      color: #94A3B8;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    #banner-text {
      font-weight: 500;
      color: #E2E8F0;
    }
    #reset-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38BDF8;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #reset-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38BDF8;
      color: #FFFFFF;
      transform: translateY(-1px);
    }
    #chart-container {
      width: 100%;
      height: 450px;
      flex: 1;
      cursor: default;
    }
    /* Pointer cursor for Sankey interaction elements */
    .node-rect, .node-label, path.link {
      cursor: pointer !important;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="banner-bar">
      <span id="banner-text">Viewing: Flow</span>
      <button id="reset-btn" type="button">↺ Reset to Full Flow</button>
    </div>
    <div id="chart-container"></div>
  </div>

  <script>
    function sendReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
    }

    function setFrameHeight(height) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height
      }, "*");
    }

    function sendClick(label) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: { clicked: label, ts: Date.now() }
      }, "*");
    }

    const resetBtn = document.getElementById("reset-btn");
    resetBtn.addEventListener("click", function() {
      sendClick("RESET");
    });

    const bannerBar = document.getElementById("banner-bar");
    const bannerText = document.getElementById("banner-text");
    const chartDiv = document.getElementById("chart-container");

    let isBound = false;

    window.addEventListener("message", function(event) {
      if (!event.data || event.data.type !== "streamlit:render") return;

      const args = event.data.args || {};
      const fig = args.figure;
      const drilldown = args.drilldown || "Full Flow";

      if (drilldown && drilldown !== "Full Flow") {
        bannerBar.style.display = "flex";
        bannerText.textContent = "Filtered: " + drilldown;
      } else {
        bannerBar.style.display = "none";
      }

      if (!fig || !fig.data || fig.data.length === 0) return;

      const layout = Object.assign({}, fig.layout || {}, {
        autosize: true,
        height: 450,
        margin: fig.layout && fig.layout.margin ? fig.layout.margin : { t: 40, l: 15, r: 15, b: 20 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)"
      });

      const config = {
        displayModeBar: false,
        responsive: true
      };

      Plotly.react(chartDiv, fig.data, layout, config).then(function(gd) {
        setFrameHeight(460);

        if (!isBound) {
          isBound = true;
          gd.on("plotly_click", function(data) {
            if (!data || !data.points || data.points.length === 0) return;
            const pt = data.points[0];
            let clickedLabel = null;

            if (pt.label) {
              clickedLabel = pt.label;
            } else if (pt.pointNumber !== undefined && data.points[0].data && data.points[0].data.node) {
              clickedLabel = data.points[0].data.node.label[pt.pointNumber];
            } else if (pt.source && pt.target) {
              // Clicked link/flow
              clickedLabel = pt.target.label || pt.source.label;
            }

            if (clickedLabel) {
              sendClick(clickedLabel);
            }
          });
        }
      });
    });

    sendReady();
    setFrameHeight(460);
  </script>
</body>
</html>
